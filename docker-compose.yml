name: hadron-erp

x-local-api-environment: &local-api-environment
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_PROFILE_BUCKET: ${MINIO_PROFILE_BUCKET:-hadron-profile-photos}
  MINIO_COLLABORATION_BUCKET: ${MINIO_COLLABORATION_BUCKET:-hadron-collaboration-files}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  IDENTITY_BOOTSTRAP_TOKEN: ${IDENTITY_BOOTSTRAP_TOKEN:-}
  FRONTEND_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
  DATA_PROTECTION_KEYS_PATH: /home/hadron/.aspnet/DataProtection-Keys

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hadron-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: hadron-minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: ./deploy/minio
    pull_policy: build
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - hadron-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  livekit:
    image: livekit/livekit-server:v1.9.6
    profiles: ["collaboration-calls"]
    restart: unless-stopped
    command: --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-configure-livekit-key}: ${LIVEKIT_API_SECRET:-configure-livekit-secret-before-enabling-profile}"
      NODE_IP: "${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP is required when collaboration calls are enabled}"
      UDP_PORT: "50000-50100"
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "50000-50100:50000-50100/udp"

  migrate:
    profiles: ["migrate"]
    image: hadron-erp-api-migrations:local
    build:
      context: .
      dockerfile: src/backend/Hadron.Erp.Api/Dockerfile
      target: migration-runtime
    environment: *local-api-environment
    volumes:
      - hadron-data-protection-keys:/home/hadron/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: hadron-erp-api:local
    build:
      context: .
      dockerfile: src/backend/Hadron.Erp.Api/Dockerfile
      target: runtime
    pull_policy: build
    restart: unless-stopped
    environment: *local-api-environment
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    volumes:
      - hadron-data-protection-keys:/home/hadron/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  web:
    profiles: ["app"]
    image: hadron-erp-web:local
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: /api
        VITE_PUBLIC_APP_ORIGIN: ${VITE_PUBLIC_APP_ORIGIN:-}
    pull_policy: build
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    volumes:
      - ./deploy/nginx/local-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  hadron-postgres-data:
  hadron-minio-data:
  hadron-data-protection-keys:
